<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Chat Toolkit</title>
  <!-- Matte "vector plastic" identity: a speech bubble in front of a document.
       Linear gradients and a dark keyline, no wet highlights. The page panel
       draws the same geometry (ui-model.js MARK_SHAPES) with the platform accent. -->
  <defs>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd49a"/><stop offset="1" stop-color="#bf9443"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f89b0"/><stop offset="1" stop-color="#39557e"/>
    </linearGradient>
  </defs>
  <g id="halo"/>
  <path fill="url(#doc)" stroke="#5f4515" stroke-width="3" stroke-linejoin="round"
        d="M28 5H47L58 16V43a3 3 0 0 1-3 3H28a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"/>
  <path fill="none" stroke="#5f4515" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        d="M47 5V14a2 2 0 0 0 2 2H58"/>
  <path fill="url(#bubble)" stroke="#202f45" stroke-width="3.5" stroke-linejoin="round"
        d="M17 20H38a13 13 0 0 1 13 13v2a13 13 0 0 1-13 13H24L12 59l2-11.6A13 13 0 0 1 4 35v-2a13 13 0 0 1 13-13Z"/>
  <circle cx="16" cy="34" r="3.8" fill="#f4f7fb"/>
  <circle cx="27.5" cy="34" r="3.8" fill="#f4f7fb"/>
  <circle cx="39" cy="34" r="3.8" fill="#f4f7fb"/>
</svg>
