name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_UPDATE_NOTIFIER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install pinned development tools
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run public behavioral tests
        run: bun run test
      - name: Run Mozilla validator
        run: bun run lint:amo
      - name: Build unsigned extension and reviewer source
        run: |
          python scripts/build-xpi.py dist/chat-toolkit-unsigned.xpi
          python scripts/build-review-source.py dist/chat-toolkit-review-source.zip
      - name: Save inspectable unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-toolkit-unsigned-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
