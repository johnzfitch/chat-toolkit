name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_UPDATE_NOTIFIER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned development tools
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run public behavioral tests
        run: bun run test
      - name: Run Mozilla validator
        run: bun run lint:amo
      - name: Build unsigned extension and reviewer source
        run: |
          python scripts/build-xpi.py dist/chat-toolkit-unsigned.xpi
          python scripts/build-review-source.py dist/chat-toolkit-review-source.zip
      - name: Save inspectable unsigned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-toolkit-unsigned-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
